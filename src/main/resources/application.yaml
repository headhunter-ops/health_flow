server:
  port: 8080

spring:
  application:
    name: healthflow-intake-service

  datasource:
    url: jdbc:postgresql://localhost:5432/healthflow
    username: postgres
    password: admin

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{Correlation-ID}] [%thread] %logger{36} - %msg%n"